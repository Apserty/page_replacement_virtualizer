<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0f172a" />
  
  <!-- Outer memory chip border -->
  <rect x="10" y="10" width="44" height="44" rx="8" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" />
  
  <!-- Memory Frame Slots -->
  <rect x="16" y="16" width="32" height="8" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <rect x="16" y="28" width="32" height="8" rx="3" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
  <rect x="16" y="40" width="32" height="8" rx="3" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" />
  
  <!-- Page Block Indicator Dots -->
  <circle cx="21" cy="20" r="2" fill="#60a5fa" />
  <circle cx="21" cy="32" r="2" fill="#93c5fd" />
  <circle cx="21" cy="44" r="2" fill="#10b981" />

  <!-- Frame content simulation lines -->
  <rect x="26" y="18.5" width="16" height="3" rx="1.5" fill="#94a3b8" />
  <rect x="26" y="30.5" width="18" height="3" rx="1.5" fill="#cbd5e1" />
  <rect x="26" y="42.5" width="14" height="3" rx="1.5" fill="#34d399" />
</svg>
